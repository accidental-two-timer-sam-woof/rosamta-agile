name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install shells
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y zsh fish; fi
          if [ "$RUNNER_OS" = "macOS" ]; then brew install fish; fi
      - name: Run tests
        working-directory: tests
        env:
          PYTHONPATH: ../src
        run: python -m unittest -v
