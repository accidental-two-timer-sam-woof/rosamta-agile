[project]
name = "rosamta"
version = "0.1.0"
description = "Prototype of rosamta: one module, many dotfiles"
requires-python = ">=3.11"

[project.scripts]
rosamta = "rosamta.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
